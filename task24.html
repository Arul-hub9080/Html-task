<!DOCTYPE html>
<html lang="en">
<head>
   
    <title> full Screen img</title>
     <style>
        body {
            background-image: url("img.jpg");
            background-attachment:fixed;
            background-size: cover;
        }

        p {
            font-size: 25px;
        }
    </style>
</head>
<body>
     <h1>Fixed Background</h1>

    <p>
        Scroll the page to see that the background image remains fixed.
    </p>

    <p>
        This is another paragraph containing some content.
    </p>

    <p>
        More content can be added here to create scrolling.
    </p>
    
</body>
</html>

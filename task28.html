<!DOCTYPE html>
<html>
<head>
    <title>google Font</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins&display=swap"
          rel="stylesheet">

    <style>
        h1 {
            font-family: 'Poppins', sans-serif;
        }

        p {
            font-family: Arial, sans-serif;
        }
    </style>
</head>
<body>

    <h1>Google Font </h1>

    <p>This paragraph use to system font.</p>

</body>
</html>
